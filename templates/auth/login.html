{% extends "base.html" %}

{% block titulo %}Iniciar Sesión | SGR Municipalidad de La Serena{% endblock %}

{% block contenido %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Acceso al Sistema SGR</h2>
            <p>Ilustre Municipalidad de La Serena</p>
        </div>
        <div class="auth-body">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="auth-form-grupo">
                    <label for="username">Usuario o Correo Institucional</label>
                    <input type="text" id="username" name="username" class="auth-input" value="{{ login_input|default:'' }}" placeholder="ej: admin o usuario@laserena.cl" required autofocus>
                </div>

                <div class="auth-form-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-auth">Ingresar al Sistema</button>

                <div style="margin-top: 18px; text-align: center; font-size: 0.88rem;">
                    <a href="{% url 'recuperar_solicitar' %}" style="color: var(--rojo-serena); text-decoration: none; font-weight: 600;">
                        ¿Olvidó su contraseña? Recupérela aquí
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
