{% extends "base.html" %}

{% block titulo %}Iniciar Sesión | SGR Municipalidad de La Serena{% endblock %}

{% block contenido %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header" style="background: #AD0000; color: #ffffff; padding: 26px 20px; text-align: center;">
            <h2 style="color: #ffffff !important; margin: 0 0 6px 0; font-size: 1.35rem; font-weight: 700;">Acceso al Sistema SGR</h2>
            <p style="color: #ffffff !important; margin: 0; font-size: 0.88rem; opacity: 0.95;">Ilustre Municipalidad de La Serena</p>
        </div>
        <div class="auth-body" style="padding: 28px 24px; background: #ffffff;">
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="auth-form-grupo" style="margin-bottom: 18px;">
                    <label for="username" style="display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.88rem; color: #212529;">Usuario o Correo Institucional</label>
                    <input type="text" id="username" name="username" class="auth-input" value="{{ login_input|default:'' }}" placeholder="ej: admin o usuario@laserena.cl" required autofocus style="width: 100%; padding: 11px 14px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; color: #212529; background: #ffffff;">
                </div>

                <div class="auth-form-grupo" style="margin-bottom: 22px;">
                    <label for="password" style="display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.88rem; color: #212529;">Contraseña</label>
                    <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" required style="width: 100%; padding: 11px 14px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.95rem; color: #212529; background: #ffffff;">
                </div>

                <button type="submit" class="btn-auth" style="width: 100%; background: #AD0000; color: #ffffff !important; border: none; padding: 12px; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer;">Ingresar al Sistema</button>

                <div style="margin-top: 20px; text-align: center; font-size: 0.88rem;">
                    <a href="{% url 'recuperar_solicitar' %}" style="color: #AD0000; text-decoration: underline; font-weight: 600;">
                        ¿Olvidó su contraseña? Recupérela aquí
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
